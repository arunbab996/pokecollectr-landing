<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — PokéCollectr</title>
<meta name="description" content="Buy Pokémon cards from real collectors — singles, slabs, bundles and live auctions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="marketplace.css">
</head>
<body>

<div class="page">

  <header class="header mp-header">
    <div class="header-left">
      <a href="index.html" class="logo">
        <span class="logo-mark"></span>
        <span class="logo-text">POKÉ<span class="logo-accent">COLLECTR</span></span>
      </a>
      <nav class="nav">
        <a href="index.html#explore" class="nav-link">Explore</a>
        <a href="index.html#portfolio" class="nav-link">Portfolio</a>
        <a href="marketplace.html" class="nav-link nav-link-active">Marketplace</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="header-icons">
        <button class="icon-btn" id="notifBtn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="icon-badge">1</span>
        </button>
        <button class="icon-btn" id="chatBtn" type="button" aria-label="Messages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span class="icon-badge">1</span>
        </button>
        <button class="icon-btn" id="cartBtn" type="button" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="icon-badge" id="cartBadge" hidden>0</span>
        </button>
      </div>

      <div class="avatar-menu">
        <button class="avatar-btn" id="avatarBtn" type="button" aria-haspopup="true" aria-expanded="false">
          <span class="avatar-circle">A</span>
          <span class="avatar-name">@abcthestar</span>
          <svg class="avatar-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="avatar-dropdown" id="avatarDropdown" hidden>
          <a href="index.html#portfolio" class="avatar-dropdown-item">Portfolio</a>
          <a href="marketplace.html" class="avatar-dropdown-item">My listings</a>
          <a href="index.html" class="avatar-dropdown-item">Sign out</a>
        </div>
      </div>
    </div>
  </header>

  <main class="mp-main">
    <div class="mp-toolbar-panel">
      <div class="mp-toolbar">
        <div class="mp-search">
          <svg class="mp-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" class="mp-search-input" placeholder="Search a card, set, or seller" autocomplete="off">
          <button class="mp-search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <a href="#" class="btn-market-cta mp-sell-cta">+ Sell a card</a>
      </div>

      <div class="mp-filters">
        <div class="mp-pillrow" id="typeFilters" role="tablist">
          <button class="mp-pill mp-pill-active" data-type="everything" type="button">Everything</button>
          <button class="mp-pill" data-type="single" type="button">Singles</button>
          <button class="mp-pill" data-type="slab" type="button">Slabs</button>
          <button class="mp-pill" data-type="bundle" type="button">Bundles</button>
          <button class="mp-pill" data-type="auction" type="button">Auctions</button>
        </div>
        <div class="mp-controls-right">
          <select id="langSelect" class="mp-sort">
            <option value="all">All languages</option>
            <option value="EN">English</option>
            <option value="JA">Japanese</option>
            <option value="KO">Korean</option>
            <option value="CN">Chinese</option>
          </select>
          <select id="sortSelect" class="mp-sort">
            <option value="newest">Newest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="bids">Most bids</option>
          </select>
          <div class="mp-view-toggle">
            <button class="mp-view-btn mp-view-active" id="gridViewBtn" type="button" aria-label="Grid view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button class="mp-view-btn" id="listViewBtn" type="button" aria-label="List view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="mp-result-count" id="resultCount"></div>

    <div class="mp-grid" id="mpGrid"></div>

    <p class="mp-empty" id="mpEmpty" hidden>No listings match your filters. Try a different search or clear a filter.</p>
  </main>

  <footer class="footer mp-footer">
    <div class="footer-links">
      <a href="index.html#explore" class="footer-link">Explore</a>
      <a href="marketplace.html" class="footer-link">Marketplace</a>
    </div>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<div class="mp-modal-backdrop" id="mpModalBackdrop" hidden>
  <div class="mp-modal" id="mpModal" role="dialog" aria-modal="true" aria-label="Listing details">
    <button class="mp-modal-close" id="mpModalClose" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="mp-modal-body" id="mpModalBody"></div>
  </div>
</div>

<script src="marketplace.js"></script>
</body>
</html>
